name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-tiger.txt
      - name: Run behavioral tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild QuantConnect export
        run: python tools/build_quantconnect.py
      - name: Check generated export matches maintained source
        run: git diff --exit-code -- platforms/quantconnect/main.py
