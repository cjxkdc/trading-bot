name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Run behavioral tests
        run: python -X utf8 tools/test_project.py
      - name: Rebuild QuantConnect export
        run: python tools/build_quantconnect.py --config tests/fixtures/portfolio_default.json
      - name: Check generated export matches maintained source
        run: git diff --exit-code -- platforms/quantconnect/main.py
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install portal dependencies
        working-directory: ui
        run: npm ci --ignore-scripts
      - name: Run portal behavior tests
        working-directory: ui
        run: node --test
      - name: Build local portal
        working-directory: ui
        run: npm run build
